# Study: core_refinement with SALSA and first-order upwind for every
# convection term, nuTilda included (overlay/system/fvSchemes replaces
# base_case's).
#
# Run:   ./run_study.sh turbulentFlatPlate/studies/core_refinement_SALSA_upwind [--isolated]
#
# Same 43-combo grid as studies/core_refinement (see its config for the core
# scaling): blockMesh baseline + snappy/gmshTri/gmshHex/snappy45 x nPrisms 20/40/50 x
# wall core cell size 5 / 2.5 / 1.25 / 0.625 mm.

models = ["SpalartAllmarasSALSA"]
approach = ["blockMesh", "snappy", "gmshTri", "gmshHex", "snappy45"]

[params]
firstLayerThickness = 1.0e-06
expansionRatio = 1.17
nPrisms = [20, 40, 50]

[params.blockMesh]
n_y = 193
n_x = 248
gradingX = 3
n_x_symmetry = 24

[params.snappy]
backgroundCellSize = 0.02
sets = [
    { wallLevel = 2, refineDistance = 0.1 },
    { wallLevel = 3, refineDistance = 0.05 },
    { wallLevel = 4, refineDistance = 0.025 },
    { wallLevel = 5, refineDistance = 0.0125 },
]

[params.snappy45]
# snappy with the core grid tilted 45 deg to the flow.  backgroundCellSize
# defaults to 0.02/sqrt(2): the snapped wall faces of a tilted square are
# h*sqrt(2) long, so the streamwise wall spacing matches snappy's 5 / 2.5 mm.
# wallLevel 4/5 (1.25 / 0.625 mm) keep the wallLevel-3 bands above level 3
# and put the finer levels in 25 / 12.5 mm strips at the wall (snappy45
# outerWallLevel; snappy's bands are unstable there) - see AGENTS.md.  They
# were run as <study>__snappy45 (2/3) and <study>__snappy45_fine (4/5).
sets = [
    { wallLevel = 2, refineDistance = 0.1 },
    { wallLevel = 3, refineDistance = 0.05 },
    { wallLevel = 4, refineDistance = 0.025 },
    { wallLevel = 5, refineDistance = 0.0125 },
]

[params.gmshTri]
wallCellSize = [0.005, 0.0025, 0.00125, 0.000625]
farCellSize = 0.06
distMin = 0.01
distMax = 0.4

[params.gmshHex]
wallCellSize = [0.005, 0.0025, 0.00125, 0.000625]
farCellSize = 0.06
distMin = 0.01
distMax = 0.4
