# Study: influence of the core mesh size behind the prism stack.
#
# Run:   ./run_study.sh turbulentFlatPlate/studies/core_refinement
#        ./run_study.sh turbulentFlatPlate/studies/core_refinement --dry-run
#
# The prisms inherit their streamwise spacing from the core cells at the wall,
# so refining the wall core size refines both the prism x-resolution and the
# core the stack hands over to.  Four scales of today's 5 mm, per approach:
#
#   scale   gmshTri/gmshHex wallCellSize   snappy wallLevel / refineDistance
#   1       5 mm                           2 / 0.1     (0.02 / 2**2 = 5 mm)
#   0.5     2.5 mm                         3 / 0.05
#   0.25    1.25 mm                        4 / 0.025
#   0.125   0.625 mm                       5 / 0.0125
#
# gmsh: only wallCellSize is scaled; farCellSize/distMin/distMax stay, so the
# far field is unchanged and the fine region stays ~10 mm thick.
# snappy: refineDistance is scaled with the wall cell, so the finest band
# stays 20 cells thick (12.5 mm at 0.625 mm, close to gmsh's distMin 10 mm)
# instead of a 0.1 m band of 0.625 mm cells (~1.5M cells).
#
# blockMesh is the single unchanged baseline every error figure compares to.
# 1 + 3 approaches x 3 nPrisms x 4 scales = 37 combos.

models = ["SpalartAllmarasSALSA"]
approach = ["blockMesh", "snappy", "gmshTri", "gmshHex"]

[params]
firstLayerThickness = 1.0e-06
expansionRatio = 1.17
nPrisms = [20, 40, 50]

[params.blockMesh]
n_y = 193
n_x = 248
gradingX = 3
n_x_symmetry = 24

[params.snappy]
backgroundCellSize = 0.02
sets = [
    { wallLevel = 2, refineDistance = 0.1 },
    { wallLevel = 3, refineDistance = 0.05 },
    { wallLevel = 4, refineDistance = 0.025 },
    { wallLevel = 5, refineDistance = 0.0125 },
]

[params.gmshTri]
wallCellSize = [0.005, 0.0025, 0.00125, 0.000625]
farCellSize = 0.06
distMin = 0.01
distMax = 0.4

[params.gmshHex]
wallCellSize = [0.005, 0.0025, 0.00125, 0.000625]
farCellSize = 0.06
distMin = 0.01
distMax = 0.4
