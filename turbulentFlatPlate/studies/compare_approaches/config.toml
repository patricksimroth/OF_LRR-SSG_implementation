# Study: all four meshing approaches, same model, same case, same solver.
#
# Run:   ./run_study.sh turbulentFlatPlate/studies/compare_approaches
#        ./run_study.sh turbulentFlatPlate/studies/compare_approaches --dry-run
#        ./run_study.sh turbulentFlatPlate/studies/compare_approaches --approaches snappy,gmshTri
#
#   blockMesh -> structured hex, wall-resolved core, no prism layers
#   snappy    -> snappyHexMesh over the whole domain: background cubes, octree
#                refinement toward the plate, snap, prism layers
#   gmshTri   -> unstructured triangular core + snappyHexMesh prism layers
#   gmshHex   -> that core's hexagon-dominant polygonal dual (polyDualMesh)
#                + snappyHexMesh prism layers
#
# [params] is shared; a [params.<approach>] sub-table overrides it for that one
# and may only name that approach's own parameters.  Each approach sizes its
# core its own way (blockMesh grading, snappy octree refinement, gmsh size
# fields), so the core controls live in per-approach blocks.
#
# The three prism-adding approaches share the SAME stack, and [params] sweeps
# three of them.  First layer stays 1e-6 m (y+ ~0.1) in every set so the wall
# cell is identical everywhere; only the count and the growth rate change.  The
# overall height follows from those three numbers and is reported in the
# manifest, not requested here.  blockMesh has no prisms but takes
# firstLayerThickness too: its wall-normal GRADING is derived from it so the
# wall cell (and wall y+) matches the prism stack.
#
# Prerequisite for gmshTri/gmshHex: gmsh in the project venv

models = ["SpalartAllmarasSALSA"]
approach = ["blockMesh", "snappy", "gmshTri", "gmshHex"]

[params]
firstLayerThickness = 1.0e-06    # fixed: same wall cell, same wall y+ everywhere
expansionRatio = 1.17            # fixed: only the layer COUNT is swept

# Sweeping nPrisms alone at a fixed ratio makes the stack height grow
# EXPONENTIALLY (height ~ first * r^n / (r - 1)), so the usable range is
# narrow - every +5 layers roughly doubles it:
#    45 layers ->  6.9 mm
#    50 layers -> 15.1 mm   (delta99 ~ 14.7 mm at x = 1 m)
#    55 layers -> 33.1 mm   (covers delta99 ~ 27 mm at the trailing edge)
# For reference, 80 layers would be 1.68 m and 120 layers 895 m, i.e. past the
# 1 m domain - snappy would roll the layers back and the combo would fail the
# <50% extrusion check.  To go taller, drop expansionRatio as well, which means
# pairing the two in [[params.sets]] instead of a plain list.
# blockMesh declares neither key, so all three collapse to ONE blockMesh run:
# 1 + 3 x 3 = 10 combos per model.
nPrisms = [5,20,30,35,40,45,50]

[params.blockMesh]
n_y = 193
n_x = 248
gradingX = 3      # streamwise last/first cell ratio over the 2 m plate
n_x_symmetry = 24

[params.snappy]
backgroundCellSize = 0.02    # background cubes; snappy refines them toward the plate
wallLevel = 2                # octree level within refineDistance (5 mm wall cells)
refineDistance = 0.1         # one level coarser per 3x that distance

[params.gmshTri]
wallCellSize = 0.005    # isotropic core size at the plate, relaxing to farCellSize
farCellSize = 0.06
distMin = 0.01
distMax = 0.4

[params.gmshHex]
wallCellSize = 0.005
farCellSize = 0.06
distMin = 0.01
distMax = 0.4
