# Timing rerun of the blockMesh baseline of results/turbulentFlatPlate/SALSA_upwind (SpalartAllmarasSALSA, first-order upwind schemes (overlay/)):
# 0.56 mm on both sides of x = 0, mapped start from the converged timing_bMsrc_upwind run
# (overlay/system/mapFieldsSource holds its CLUSTER path - this study runs only there,
# after timing_bMsrc_upwind is archived).
#
# Run:   zih.sh submit timing_bM_SALSA_upwind

models = ["SpalartAllmarasSALSA"]
approach = "blockMesh"

[params]
firstLayerThickness = 1.0e-06

[params.blockMesh]
n_y = 193
n_x = 420
gradingX = 30
n_x_symmetry = 64
dxSymmetryLE = 0.0005574
