# Study: the wallLevel 4/5 snappy45 runs of studies/core_refinement (snappy with the core grid tilted
# 45 deg to the flow), run on their own so results/<case>/core_refinement is not wiped.
# Split from <study>__snappy45 (levels 2/3) after the first level-4/5 meshes
# crashed.  Since 2026-10-23 snappy45 keeps the wallLevel-3 bands (0.05/0.15/0.45 m)
# above level 3 and puts level 4/5 in 25/12.5 mm strips (outerWallLevel);
# refineDistance is then unused.  Merged into that study's results for post-processing; same model,
# schemes (overlay/) and grid as there.
#
# Run:   ./run_study.sh turbulentFlatPlate/studies/core_refinement__snappy45_fine [--isolated]

models = ["SpalartAllmarasSALSA"]
approach = "snappy45"

[params]
firstLayerThickness = 1.0e-06
expansionRatio = 1.17
nPrisms = [20, 40, 50]

[params.snappy45]
sets = [
    { wallLevel = 4, refineDistance = 0.025 },
    { wallLevel = 5, refineDistance = 0.0125 },
]
