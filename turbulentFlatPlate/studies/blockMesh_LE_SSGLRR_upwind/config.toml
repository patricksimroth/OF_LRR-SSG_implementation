# L2 blockMesh baseline of studies/blockMesh_LE with first-order upwind
# (overlay/system/fvSchemes = core_refinement_SSGLRR_upwind's); replaces the
# blockMesh run of results/turbulentFlatPlate/SSGLRR_upwind.
#
# Run locally (2026-10-28, v2512): the SSGLRR_upwind study is v2506 (Romeo),
# which reproduces v2512 to 5-6 digits in Cd (AGENTS.md).

models = ["SSGLRROmega2019"]
approach = "blockMesh"

[params]
firstLayerThickness = 1.0e-06

[params.blockMesh]
n_y = 193
n_x = 420
gradingX = 30
n_x_symmetry = 24
