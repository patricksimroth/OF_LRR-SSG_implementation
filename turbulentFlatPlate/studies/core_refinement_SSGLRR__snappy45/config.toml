# Study: the snappy45 runs of studies/core_refinement_SSGLRR (snappy with the core grid tilted
# 45 deg to the flow), run on their own so results/<case>/core_refinement_SSGLRR is not wiped.
# They are merged into that study's results for post-processing; same model,
# schemes (overlay/) and grid as there.
#
# Run:   ./run_study.sh turbulentFlatPlate/studies/core_refinement_SSGLRR__snappy45 [--isolated]

models = ["SSGLRROmega2019"]
approach = "snappy45"

[params]
firstLayerThickness = 1.0e-06
expansionRatio = 1.17
nPrisms = [20, 40, 50]

[params.snappy45]
sets = [
    { wallLevel = 2, refineDistance = 0.1 },
    { wallLevel = 3, refineDistance = 0.05 },
    { wallLevel = 4, refineDistance = 0.025 },
    { wallLevel = 5, refineDistance = 0.0125 },
]
